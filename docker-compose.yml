version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: projeto_banco_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/infrastructure/database/migrations/001_create_schema.sql:/docker-entrypoint-initdb.d/001_create_schema.sql

volumes:
  pgdata:
